[workspace]
members = [".", "tools/benchctl"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[package]
name = "snoozer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Low-latency thread waiting primitives"
repository = "https://github.com/nowaalex/snoozer"
keywords = ["concurrency", "latency", "thread", "mwaitx"]
categories = ["concurrency", "hardware-support"]

[[bench]]
name = "wake_latency"
harness = false

[workspace.dependencies]
cargo_metadata = "0.23"
clap = { version = "4.6", features = ["derive"] }
loom = "0.7.2"
nix = { version = "0.30", features = ["process", "signal", "user"] }
rustix = { version = "1", features = ["event", "fs", "pipe", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
thiserror = "2.0"

[dev-dependencies]
loom.workspace = true
rustix.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true

[features]
default = []
# This feature exists only so the repository benchmark can measure the C1
# diagnostic boundary. It is not part of the supported library API.
benchmark-only = []

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
let_underscore_future = "deny"
let_underscore_must_use = "deny"
