[workspace]
members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[package]
name = "snoozer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Low-latency thread waiting primitives"
repository = "https://github.com/nowaalex/snoozer"
keywords = ["concurrency", "latency", "thread", "mwaitx"]
categories = ["concurrency", "hardware-support"]

[[bench]]
name = "wake_latency"
harness = false

[features]
default = []
# This feature exists only so the repository benchmark can measure the C1
# diagnostic boundary. It is not part of the supported library API.
benchmark-only = []

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
let_underscore_future = "deny"
let_underscore_must_use = "deny"
