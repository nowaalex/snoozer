name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
          targets: aarch64-unknown-linux-gnu

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.140

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --workspace --all-targets --all-features

      - name: Check unsupported-target boundary
        run: cargo check --workspace --all-features --target aarch64-unknown-linux-gnu

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check benchmark shell syntax
        run: sh -n scripts/run_with_cpuidle.sh scripts/test_run_with_cpuidle.sh scripts/build_benchmark.sh scripts/test_build_benchmark.sh

      - name: Test benchmark build provenance
        run: timeout 30s sh scripts/test_build_benchmark.sh

      - name: Test CPU-idle runner recovery
        run: timeout 240s sh scripts/test_run_with_cpuidle.sh

      - name: Run tests
        run: cargo nextest run --workspace --all-features --profile ci

      - name: Run doctests
        run: cargo test --workspace --all-features --doc

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
